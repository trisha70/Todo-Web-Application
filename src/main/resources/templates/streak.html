<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Streaks | TodoBuddy 🔥</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

        :root {
            --bg: #f0f2ff;
            --sidebar: #ffffff;
            --text: #2d3436;
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #fd79a8; /* Strawberry for fire theme */
            --card-bg: #ffffff;
            --gradient: linear-gradient(135deg, #ff7675 0%, #fd79a8 100%);
            --shadow: 0 15px 35px rgba(253, 121, 168, 0.15);
        }

        .dark {
            --bg: #0b0e14;
            --sidebar: #161b22;
            --text: #f0f0f0;
            --primary: #a29bfe;
            --card-bg: #1c2128;
            --gradient: linear-gradient(135deg, #fd79a8 0%, #e84393 100%);
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar (Same as Dashboard) */
        .sidebar {
            width: 280px;
            background: var(--sidebar);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-links a:hover, .nav-links a.active {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        .logout {
            background: #ff7675;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        /* Streak Card */
        .streak-container {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 32px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            text-align: center;
            animation: popIn 0.6s ease;
        }

        .card.main-streak {
            grid-column: span 2;
            background: var(--card-bg);
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 8px;
            background: var(--gradient);
        }

        .fire-icon {
            font-size: 80px;
            margin-bottom: 10px;
            filter: drop-shadow(0 10px 15px rgba(255, 118, 117, 0.4));
        }

        .streak-number {
            font-size: 4rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .label {
            font-size: 1.2rem;
            font-weight: 600;
            opacity: 0.7;
            margin-top: 10px;
        }

        /* Mini Stats */
        .mini-card {
            padding: 25px;
        }

        .mini-card h3 {
            font-size: 2rem;
            color: var(--primary);
        }

        /* Toggle Button */
        .toggle {
            width: 50px; height: 50px; border-radius: 50%;
            border: none; background: var(--card-bg);
            box-shadow: var(--shadow); cursor: pointer;
            font-size: 22px; display: grid; place-items: center;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .streak-container { grid-template-columns: 1fr; }
            .card.main-streak { grid-column: span 1; }
        }
    </style>
</head>

<body>

<div class="sidebar">
    <div>
        <div class="logo">TodoBuddy ✨</div>
        <div class="nav-links">
            <a th:href="@{/dashboard}">🏠 Dashboard</a>
            <a th:href="@{/yourTasks}">✅ My Tasks</a>
            <a th:href="@{/progress}">📊 Progress</a>
            <a href="@{/streak}" class="active">🔥 Streaks</a>
            <a th:href="@{/settings}">⚙️ Settings</a>
        </div>
    </div>
    <a href="/logout" class="logout">Sign Out</a>
</div>

<div class="main">
    <div class="header">
        <h2 style="font-size: 2.2rem; font-weight: 800;">Don't let the <span style="color: #ff7675;">fire</span> die!</h2>
        <button class="toggle" onclick="toggleDark()">🌙</button>
    </div>

    <div class="streak-container">
        <div class="card main-streak">
            <div class="fire-icon">🔥</div>
            <div class="streak-number" th:text="${currentStreak}">0</div>
            <div class="label">Day Current Streak</div>
            <p style="margin-top: 20px; opacity: 0.8;">
                Complete all your daily tasks before midnight to keep the flame alive!
            </p>
        </div>

        <div class="card mini-card">
            <div style="font-size: 2rem;">🏆</div>
            <h3 th:text="${longestStreak}">0</h3>
            <div class="label">Longest Streak</div>
        </div>

        <div class="card mini-card">
            <div style="font-size: 2rem;">⚡</div>
            <h3>Active</h3>
            <div class="label" th:text="${currentStreak > 0 ? 'Status: Flaming' : 'Status: Frozen'}">Status</div>
        </div>
    </div>
</div>

<script>
    function toggleDark() {
        document.body.classList.toggle("dark");
        const btn = document.querySelector(".toggle");
        btn.innerHTML = document.body.classList.contains("dark") ? "☀️" : "🌙";
        localStorage.setItem('todo-theme', document.body.classList.contains("dark") ? 'dark' : 'light');
    }

    if (localStorage.getItem('todo-theme') === 'dark') {
        document.body.classList.add('dark');
        document.querySelector(".toggle").innerHTML = "☀️";
    }
</script>

</body>
</html>
