<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Settings | TodoBuddy ⚙️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

:root {
  --bg: #f0f2ff;
  --sidebar: #ffffff;
  --text: #2d3436;
  --primary: #6c5ce7;
  --secondary: #a29bfe;
  --accent: #00cec9;
  --card-bg: #ffffff;
  --input-bg: #f8f9ff;
  --gradient: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
  --shadow: 0 15px 35px rgba(108, 92, 231, 0.15);
}

.dark {
  --bg: #0b0e14;
  --sidebar: #161b22;
  --text: #f0f0f0;
  --primary: #a29bfe;
  --card-bg: #1c2128;
  --input-bg: #2d333b;
  --shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
}

* { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
  transition: background-color 0.3s, color 0.3s, transform 0.2s, box-shadow 0.3s;
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* --- SIDEBAR --- */
.sidebar {
  width: 280px;
  background: var(--sidebar);
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-right: 1px solid rgba(0,0,0,0.05);
  box-shadow: 10px 0 30px rgba(0,0,0,0.02);
  position: sticky;
  top: 0;
  height: 100vh;
}

.logo {
  font-size: 28px;
  font-weight: 800;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 40px;
  letter-spacing: -1px;
}

.nav-links a {
  display: flex;
  align-items: center;
  padding: 15px 20px;
  border-radius: 20px;
  text-decoration: none;
  color: var(--text);
  margin-bottom: 8px;
  font-weight: 600;
  font-size: 0.95rem;
}

.nav-links a:hover, .nav-links a.active {
  background: var(--primary);
  color: white !important;
  transform: scale(1.05);
  box-shadow: 0 10px 20px rgba(108, 92, 231, 0.2);
}

.logout {
  background: #ff7675;
  color: white;
  padding: 15px;
  text-align: center;
  border-radius: 20px;
  text-decoration: none;
  font-weight: 800;
  box-shadow: 0 8px 20px rgba(255, 118, 117, 0.2);
}

/* --- MAIN CONTENT --- */
.main {
  flex: 1;
  padding: 60px;
  max-width: 1000px;
  margin: 0 auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 50px;
}

.header h2 {
  font-size: 2.2rem;
  font-weight: 800;
}

.header span { color: var(--primary); }

.toggle-theme {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: none;
  background: var(--card-bg);
  box-shadow: var(--shadow);
  cursor: pointer;
  font-size: 22px;
  display: grid;
  place-items: center;
}

/* --- SETTINGS CARDS --- */
.settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: 30px;
}

.settings-card {
  background: var(--card-bg);
  padding: 40px;
  border-radius: 32px;
  box-shadow: var(--shadow);
  border-top: 6px solid var(--primary);
  animation: fadeInUp 0.6s ease forwards;
}

.settings-card:nth-child(2) {
  border-top-color: var(--accent);
  animation-delay: 0.2s;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

h3 {
  margin-bottom: 25px;
  font-size: 1.5rem;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 12px;
}

/* --- FORMS --- */
.form-group {
  margin-bottom: 22px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  font-size: 0.9rem;
  opacity: 0.8;
}

input, select {
  width: 100%;
  padding: 14px 20px;
  border-radius: 16px;
  border: 2px solid transparent;
  background: var(--input-bg);
  color: var(--text);
  font-family: inherit;
  font-size: 1rem;
  outline: none;
}

input[readonly] {
  opacity: 0.6;
  cursor: not-allowed;
}

input:focus, select:focus {
  border-color: var(--primary);
  background: var(--card-bg);
  box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
}

.btn-save {
  width: 100%;
  background: var(--gradient);
  color: white;
  border: none;
  padding: 16px;
  border-radius: 18px;
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
  margin-top: 10px;
}

.btn-save:hover {
  transform: translateY(-3px);
  filter: brightness(1.1);
  box-shadow: 0 12px 25px rgba(108, 92, 231, 0.4);
}

@media (max-width: 768px) {
  body { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: relative; }
  .settings-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="sidebar">
  <div>
    <div class="logo">TodoBuddy ✨</div>
    <div class="nav-links">
      <a th:href="@{/dashboard}">🏠 Dashboard</a>
      <a th:href="@{/yourTasks}">✅ My Tasks</a>
      <a th:href="@{/progress}">📊 Progress</a>
      <a th:href="@{/streak}">🔥 Streaks</a>
      <a th:href="@{/settings}" class="active">⚙️ Settings</a>
    </div>
  </div>
  <a href="/logout" class="logout">Sign Out</a>
</div>

<div class="main">

  <div class="header">
    <h2>Account <span>Settings</span> ⚙️</h2>
    <button class="toggle-theme" onclick="toggleDark()" id="themeBtn">🌙</button>
  </div>

  <div class="settings-grid">

    <div class="settings-card">
      <h3>👤 Update Profile</h3>
      <form th:action="@{/settings/update}" method="post">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" th:value="${user.name}" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label>Email (Locked)</label>
          <input type="email" name="email" th:value="${user.email}" readonly>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" name="phoneNo" th:value="${user.phoneNo}" placeholder="+1 234 567 890">
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" name="dob" th:value="${user.dob}">
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select name="gender">
            <option value="">Select Gender</option>
            <option value="Male" th:selected="${user.gender=='Male'}">Male</option>
            <option value="Female" th:selected="${user.gender=='Female'}">Female</option>
            <option value="Other" th:selected="${user.gender=='Other'}">Other</option>
          </select>
        </div>

        <button type="submit" class="btn-save">Save Changes</button>
      </form>
    </div>

    <div class="settings-card">
      <h3>🔒 Security</h3>
      <form th:action="@{/settings/password}" method="post">
        <div class="form-group">
          <label>Current Password</label>
          <input type="password" name="current" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label>New Password</label>
          <input type="password" name="newPass" placeholder="New password" required>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" name="confirmPassword" placeholder="Confirm new password" required>
        </div>

        <button type="submit" class="btn-save" style="background: var(--accent); box-shadow: 0 8px 20px rgba(0, 206, 201, 0.2);">Update Password</button>
      </form>
    </div>

  </div>
</div>

<script>
function toggleDark() {
  document.body.classList.toggle("dark");
  const btn = document.getElementById("themeBtn");
  btn.innerHTML = document.body.classList.contains("dark") ? "☀️" : "🌙";
}
</script>

</body>
</html>
