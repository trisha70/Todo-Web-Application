<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Quick Add | TodoBuddy ✨</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

:root {
  --bg: #f0f2ff;
  --sidebar: #ffffff;
  --text: #2d3436;
  --primary: #6c5ce7;
  --secondary: #a29bfe;
  --accent: #00cec9;
  --highlight: #fd79a8;
  --card-bg: #ffffff;
  --gradient: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
  --shadow: 0 15px 35px rgba(108, 92, 231, 0.15);
  --input-bg: #f8f9fa;
}

.dark {
  --bg: #0b0e14;
  --sidebar: #161b22;
  --text: #f0f0f0;
  --primary: #a29bfe;
  --secondary: #6c5ce7;
  --accent: #55efc4;
  --highlight: #fab1a0;
  --card-bg: #1c2128;
  --gradient: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
  --shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
  --input-bg: #2d333b;
}

* { 
  margin: 0; padding: 0; box-sizing: border-box; 
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 280px;
  background: var(--sidebar);
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-right: 1px solid rgba(0,0,0,0.05);
  z-index: 10;
}

.logo {
  font-size: 28px;
  font-weight: 800;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 40px;
}

.nav-links a {
  display: flex;
  align-items: center;
  padding: 15px 20px;
  border-radius: 20px;
  text-decoration: none;
  color: var(--text);
  margin-bottom: 8px;
  font-weight: 600;
}

.nav-links a:hover {
  background: var(--primary);
  color: white !important;
  transform: scale(1.05);
}

/* Main Content */
.main { flex: 1; padding: 60px; overflow-y: auto; }

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 50px;
}

/* Form Styling within Card */
.quick-add-form {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-top: 20px;
}

input, select {
  width: 100%;
  padding: 12px 18px;
  border-radius: 12px;
  border: 2px solid transparent;
  background: var(--input-bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-size: 0.95rem;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  background: var(--card-bg);
}

button.submit-btn {
  background: var(--gradient);
  color: white;
  border: none;
  padding: 12px;
  border-radius: 12px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
  margin-top: 10px;
}

button.submit-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
}

/* Card Visuals */
.card {
  background: var(--card-bg);
  padding: 40px 30px;
  border-radius: 32px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  animation: popIn 0.5s ease backwards;
}

.card::before {
  content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 6px;
  background: var(--gradient);
}
.logout {
  background: #a31839;
  color: white;
  padding: 15px;
  text-align: center;
  border-radius: 20px;
  text-decoration: none;
  font-weight: 800;
  box-shadow: 0 8px 20px rgba(255, 118, 117, 0.3);
}


@keyframes popIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.toggle {
  width: 50px; height: 50px; border-radius: 50%; border: none;
  background: var(--card-bg); box-shadow: var(--shadow); cursor: pointer;
}
</style>
</head>
<body>

	<div class="sidebar">
	  <div>
	    <div class="logo">TodoBuddy ✨</div>
	    <div class="nav-links">
	      <a th:href="@{/dashboard}" style="background: var(--primary); color: white;">🏠 Dashboard </a>
	      <a th:href="@{/yourTasks}">✅ My Tasks</a>
	      <a href="#">📊 Progress</a>
	      <a href="#">🔥 Streaks</a>
	      <a th:href="@{/settings}">⚙️ Settings</a>
	    </div>
	  </div>
	  <a href="/logout" class="logout">Sign Out</a>
	</div>

<div class="main">
  <div class="header">
    <h2>New <span>Task?</span> 🚀</h2>
    <button class="toggle" onclick="toggleDark()">🌙</button>
  </div>

  <div style="max-width: 500px; margin: 0 auto;">
    <div class="card quick-add">
      <h3>Quick Add</h3>
      <p>Fill in the details to stay on track.</p>
      
      <form th:action="@{/saveTask}" method="post" th:object="${task}" class="quick-add-form">
        <input type="text" name="title" placeholder="What needs to be done?" required>
		<label>Date</label>
		<input type="date" th:field="*{taskDate}" required>

		<label>Start Time</label>
		<input type="time" th:field="*{startTime}" required>

		<label>End Time</label>
		<input type="time" th:field="*{endTime}" required>

        <select name="priority">
          <option value="LOW">Low Priority 🧊</option>
          <option value="MEDIUM" selected>Medium Priority ⚡</option>
          <option value="HIGH">High Priority 🔥</option>
        </select>
        
        <button type="submit" class="submit-btn">Add to My List</button>
      </form>
    </div>
  </div>
</div>

<script>
function toggleDark() {
  document.body.classList.toggle("dark");
  const btn = document.querySelector(".toggle");
  btn.innerHTML = document.body.classList.contains("dark") ? "☀️" : "🌙";
}
</script>

</body>
</html>
