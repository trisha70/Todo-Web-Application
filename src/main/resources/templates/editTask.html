<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Task | TodoBuddy ✨</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

:root {
  --bg: #f0f2ff;
  --text: #2d3436;
  --primary: #6c5ce7;
  --secondary: #a29bfe;
  --card-bg: #ffffff;
  --gradient: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
  --shadow: 0 15px 35px rgba(108, 92, 231, 0.15);
  --input-bg: #f8f9fa;
}

.dark {
  --bg: #0b0e14;
  --text: #f0f0f0;
  --primary: #a29bfe;
  --card-bg: #1c2128;
  --shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
  --input-bg: #2d333b;
}

* { 
  margin: 0; padding: 0; box-sizing: border-box; 
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

/* Edit Card Container */
.edit-container {
  width: 100%;
  max-width: 500px;
  background: var(--card-bg);
  padding: 40px;
  border-radius: 35px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  animation: popIn 0.6s ease;
}

.edit-container::before {
  content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 8px;
  background: var(--gradient);
}

@keyframes popIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

h2 {
  font-size: 2rem;
  font-weight: 800;
  margin-bottom: 10px;
  text-align: center;
}

h2 span { color: var(--primary); }

.subtitle {
  text-align: center;
  opacity: 0.6;
  margin-bottom: 30px;
  display: block;
}

/* Form Styling */
.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  font-size: 0.9rem;
  padding-left: 5px;
}

input, select {
  width: 100%;
  padding: 14px 20px;
  border-radius: 15px;
  border: 2px solid transparent;
  background: var(--input-bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-size: 1rem;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  background: var(--card-bg);
  box-shadow: 0 0 15px rgba(108, 92, 231, 0.1);
}

/* Buttons */
.btn-group {
  display: flex;
  gap: 15px;
  margin-top: 30px;
}

.update-btn {
  flex: 2;
  background: var(--gradient);
  color: white;
  border: none;
  padding: 15px;
  border-radius: 18px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
}

.update-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 25px rgba(108, 92, 231, 0.4);
}

.back-btn {
  flex: 1;
  background: rgba(0, 0, 0, 0.05);
  color: var(--text);
  text-decoration: none;
  text-align: center;
  padding: 15px;
  border-radius: 18px;
  font-weight: 600;
}

.dark .back-btn { background: rgba(255, 255, 255, 0.05); }

.back-btn:hover {
  background: #ff7675;
  color: white;
}

.toggle {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.2rem;
}

</style>
</head>
<body>

<div class="edit-container">
  <button class="toggle" onclick="toggleDark()">🌙</button>
  
  <h2>Edit <span>Task</span> ✏️</h2>
  <span class="subtitle">Make adjustments to your plan</span>

  <form th:action="@{/task/update}" method="post" th:object="${task}">
    
    <input type="hidden" th:field="*{id}">

    <div class="form-group">
      <label>Task Title</label>
      <input type="text" th:field="*{title}" placeholder="What's the plan?" required>
    </div>

    <div class="form-group">
      <label>Date</label>
      <input type="date" th:field="*{taskDate}" required>
    </div>

    <div style="display: flex; gap: 15px;">
      <div class="form-group" style="flex: 1;">
        <label>Start Time</label>
        <input type="time" th:field="*{startTime}" required>
      </div>
      <div class="form-group" style="flex: 1;">
        <label>End Time</label>
        <input type="time" th:field="*{endTime}" required>
      </div>
    </div>

    <div class="form-group">
      <label>Priority Level</label>
      <select th:field="*{priority}">
        <option value="LOW">Low - Chill 🧊</option>
        <option value="MEDIUM">Medium - Steady ⚡</option>
        <option value="HIGH">High - Urgent 🔥</option>
      </select>
    </div>

    <div class="btn-group">
      <a th:href="@{/yourTasks}" class="back-btn">← Back</a>
      <button type="submit" class="update-btn">Save Changes</button>
    </div>

  </form>
</div>

<script>
function toggleDark() {
  document.body.classList.toggle("dark");
  const btn = document.querySelector(".toggle");
  btn.innerHTML = document.body.classList.contains("dark") ? "☀️" : "🌙";
}
</script>

</body>
</html>
