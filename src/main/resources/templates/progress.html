<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Progress | TodoBuddy ✨</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

        :root {
            --bg: #f0f2ff;
            --sidebar: #ffffff;
            --text: #2d3436;
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #00cec9; 
            --highlight: #fd79a8;
            --card-bg: #ffffff;
            --gradient: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            --shadow: 0 15px 35px rgba(108, 92, 231, 0.15);
            --progress-track: #eee;
        }

        .dark {
            --bg: #0b0e14;
            --sidebar: #161b22;
            --text: #f0f0f0;
            --primary: #a29bfe;
            --secondary: #6c5ce7;
            --accent: #55efc4;
            --highlight: #fab1a0;
            --card-bg: #1c2128;
            --gradient: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            --progress-track: #2d3436;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--sidebar);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid rgba(0,0,0,0.05);
            box-shadow: 10px 0 30px rgba(0,0,0,0.02);
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            letter-spacing: -1px;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-links a:hover, .nav-links a.active {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
        }

        .logout {
            background: #ff7675;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 60px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h2 { font-size: 2.2rem; font-weight: 800; }
        .header span { color: var(--primary); }

        .toggle {
            width: 50px; height: 50px; border-radius: 50%;
            border: none; background: var(--card-bg);
            box-shadow: var(--shadow); cursor: pointer;
            font-size: 22px; display: grid; place-items: center;
        }

        /* Progress Card Specifics */
        .progress-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 32px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background: var(--gradient);
        }

        /* Progress Bar */
        .progressbar-wrapper {
            background: var(--progress-track);
            height: 24px;
            border-radius: 50px;
            margin: 30px 0;
            overflow: hidden;
            border: 4px solid var(--card-bg);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .progressfill {
            height: 100%;
            background: var(--gradient);
            border-radius: 50px;
            transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .percentage-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Accent Colors for stats */
        .stat-total { color: var(--primary); }
        .stat-done { color: var(--accent); }
        .stat-pending { color: var(--highlight); }

        .btn-refresh {
            margin-top: 30px;
            padding: 15px 35px;
            border-radius: 25px;
            border: none;
            background: var(--gradient);
            color: white;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.2);
        }

        .btn-refresh:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(108, 92, 231, 0.4); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate { animation: slideUp 0.6s ease forwards; }

    </style>
</head>

<body>

<div class="sidebar">
    <div>
        <div class="logo">TodoBuddy ✨</div>
        <div class="nav-links">
            <a th:href="@{/dashboard}">🏠 Dashboard</a>
            <a th:href="@{/yourTasks}">✅ My Tasks</a>
            <a th:href="@{/progress}" class="active">📊 Progress</a>
            <a th:href="@{/streak}">🔥 Streaks</a>
            <a th:href="@{/settings}">⚙️ Settings</a>
        </div>
    </div>
    <a href="/logout" class="logout">Sign Out</a>
</div>

<div class="main">
    <div class="header">
        <h2>Your <span>Progress</span> 📈</h2>
        <button class="toggle" onclick="toggleDark()">🌙</button>
    </div>

    <div class="progress-container">
        <div class="card animate">
            <h3>Overall Completion</h3>
            <div class="percentage-display" th:text="${progress + '%'}">0%</div>
            
            <div class="progressbar-wrapper">
                <div class="progressfill" th:style="'width:' + ${progress} + '%'"></div>
            </div>
            
            <p th:if="${progress == 100}">Amazing! You've crushed all your tasks! 🏆</p>
            <p th:if="${progress < 100}">Keep going, you're doing great! 🚀</p>
            
            <button class="btn-refresh" onclick="location.reload()">Refresh Stats</button>
        </div>

        <div class="stat-grid">
            <div class="card animate" style="animation-delay: 0.1s;">
                <span class="stat-label">Total</span>
                <span class="stat-value stat-total" th:text="${total}">0</span>
            </div>
            <div class="card animate" style="animation-delay: 0.2s;">
                <span class="stat-label">Completed</span>
                <span class="stat-value stat-done" th:text="${completed}">0</span>
            </div>
            <div class="card animate" style="animation-delay: 0.3s;">
                <span class="stat-label">Pending</span>
                <span class="stat-value stat-pending" th:text="${pending}">0</span>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleDark() {
        document.body.classList.toggle("dark");
        const btn = document.querySelector(".toggle");
        btn.innerHTML = document.body.classList.contains("dark") ? "☀️" : "🌙";
        localStorage.setItem('todo-theme', document.body.classList.contains("dark") ? 'dark' : 'light');
    }

    // Persist theme on load
    if (localStorage.getItem('todo-theme') === 'dark') {
        document.body.classList.add('dark');
        document.querySelector(".toggle").innerHTML = "☀️";
    }
</script>

</body>
</html>
