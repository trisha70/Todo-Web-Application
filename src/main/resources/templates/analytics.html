<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Analytics | TodoBuddy ✨</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

        :root {
            --bg: #f0f2ff;
            --sidebar: #ffffff;
            --text: #2d3436;
            --primary: #6c5ce7;
            --card-bg: #ffffff;
            --gradient: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            --shadow: 0 15px 35px rgba(108, 92, 231, 0.12);
            --border: rgba(0,0,0,0.05);
        }

        /* Dark Mode Override */
        body.dark {
            --bg: #0b0e14;
            --sidebar: #161b22;
            --text: #f0f0f0;
            --primary: #a29bfe;
            --card-bg: #1c2128;
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            --border: rgba(255,255,255,0.05);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            transition: background 0.3s, color 0.3s, transform 0.2s; 
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--sidebar);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid var(--border);
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .nav-links a:hover, .nav-links a.active {
            background: var(--primary);
            color: white !important;
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.2);
        }

        .logout {
            background: #ff7675;
            color: white;
            padding: 14px;
            text-align: center;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 800;
        }

        /* Main Area */
        .main {
            flex: 1;
            padding: 40px 50px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .toggle {
            width: 45px; height: 45px; border-radius: 50%;
            border: none; background: var(--card-bg);
            box-shadow: var(--shadow); cursor: pointer;
            font-size: 20px; display: grid; place-items: center;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            border-bottom: 4px solid var(--primary);
        }

        .stat-card h3 { font-size: 0.8rem; opacity: 0.6; text-transform: uppercase; margin-bottom: 5px; }
        .stat-card p { font-size: 1.6rem; font-weight: 800; }

        /* Charts Layout */
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 25px;
        }

        .chart-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            min-height: 350px;
        }

        .chart-card h4 { margin-bottom: 20px; font-weight: 700; opacity: 0.8; }

        .canvas-holder {
            position: relative;
            height: 250px;
            width: 100%;
        }

        @media (max-width: 1024px) {
            .charts-container { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div>
            <div class="logo">TodoBuddy ✨</div>
            <div class="nav-links">
                <a th:href="@{/dashboard}">🏠 Dashboard</a>
                <a th:href="@{/yourTasks}">✅ My Tasks</a>
                <a th:href="@{/progress}">📊 Progress</a>
                <a th:href="@{/streak}">🔥 Streaks</a>
                <a href="#" class="active">📈 Analytics</a>
            </div>
        </div>
        <a href="/logout" class="logout">Sign Out</a>
    </div>

    <div class="main">
        <div class="header">
            <h2>Data <span>Insights</span> 📊</h2>
            <button class="toggle" id="themeBtn" onclick="toggleDark()">🌙</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><h3>Total</h3><p th:text="${total}">0</p></div>
            <div class="stat-card"><h3>Done</h3><p th:text="${completed}">0</p></div>
            <div class="stat-card"><h3>Pending</h3><p th:text="${pending}">0</p></div>
            <div class="stat-card"><h3>Today</h3><p th:text="${today}">0</p></div>
            <div class="stat-card" style="border-color: #00cec9;"><h3>Rate</h3><p th:text="${rate + '%'}">0%</p></div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <h4>Priority Split</h4>
                <div class="canvas-holder">
                    <canvas id="priorityChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h4>Weekly Activity</h4>
                <div class="canvas-holder">
                    <canvas id="activityChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // 1. THEME TOGGLE LOGIC
        function toggleDark() {
            const body = document.body;
            const isDark = body.classList.toggle("dark");
            const btn = document.getElementById("themeBtn");
            
            btn.innerHTML = isDark ? "☀️" : "🌙";
            localStorage.setItem('todoBuddyTheme', isDark ? 'dark' : 'light');
        }

        // Initialize Theme on Load
        if (localStorage.getItem('todoBuddyTheme') === 'dark') {
            document.body.classList.add('dark');
            document.getElementById("themeBtn").innerHTML = "☀️";
        }

        // 2. CHART LOGIC (Thymeleaf Inlining)
        // These variables pull data directly from your Spring Boot Controller
        const high = /*[[${high}]]*/ 0;
        const medium = /*[[${medium}]]*/ 0;
        const low = /*[[${low}]]*/ 0;
        const weekly = /*[[${weekly}]]*/ [0,0,0,0,0,0,0];

        // Priority Doughnut Chart
        new Chart(document.getElementById('priorityChart'), {
            type: 'doughnut',
            data: {
                labels: ['High', 'Medium', 'Low'],
                datasets: [{
                    data: [high, medium, low],
                    backgroundColor: ['#ff7675', '#fdcb6e', '#55efc4'],
                    borderWidth: 0
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } }
            }
        });

        // Weekly Bar Chart
        new Chart(document.getElementById('activityChart'), {
            type: 'bar',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Completed Tasks',
                    data: weekly,
                    backgroundColor: '#6c5ce7',
                    borderRadius: 10
                }]
            },
            options: {
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { display: false } },
                    x: { grid: { display: false } }
                }
            }
        });
    </script>
</body>
</html>
