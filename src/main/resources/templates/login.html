<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | TodoBuddy 💜</title>

<style>
:root {
  --bg: #fdf6ff;
  --text: #2d2d2d;
  --card: #ffffff;
  --primary: #7c4dff;
  --accent: #ffd166;
}

.dark {
  --bg: #121212;
  --text: #f1f1f1;
  --card: #1e1e1e;
  --primary: #bb86fc;
  --accent: #f1c40f;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  background: var(--card);
  width: 95%;
  max-width: 450px;
  padding: 40px;
  border-radius: 30px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.1);
  position: relative;
}

h2 {
  text-align: center;
  color: var(--primary);
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  font-size: 0.9rem;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 15px;
  border: 1px solid #ccc;
  margin-bottom: 18px;
  background: transparent;
  color: var(--text);
}

input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 8px rgba(124,77,255,0.2);
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 25px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  background: var(--primary);
  color: white;
}

button:hover {
  transform: translateY(-3px);
}

.toggle {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 34px;
  height: 34px;
  background: var(--accent);
  border-radius: 50%;
  border: none;
  cursor: pointer;
}

.footer-link {
  text-align: center;
  margin-top: 18px;
}

.footer-link a {
  color: var(--primary);
  font-weight: bold;
  text-decoration: none;
}

.back-home {
  position: absolute;
  top: 20px;
  left: 25px;
  font-size: 0.85rem;
  text-decoration: none;
  color: var(--primary);
  font-weight: 600;
}

.message {
  text-align: center;
  margin-bottom: 15px;
  font-size: 14px;
}
.error { color: red; }
.success { color: green; }
</style>
</head>

<body>

<div class="container">

<a th:href="@{/}" class="back-home">← Home</a>
<button class="toggle" onclick="toggleDark()">🌗</button>

<h2>Welcome Back 💜</h2>
<p class="subtitle">Login to continue your productivity journey ✨</p>

<!-- ERROR MESSAGE -->
<p class="message error" th:if="${param.error}">
    Invalid Email or Password!
</p>

<!-- LOGOUT MESSAGE -->
<p class="message success" th:if="${param.logout}">
    You have been logged out successfully.
</p>

<form th:action="@{/login}" method="post">

    <!-- IMPORTANT FIX HERE -->
    <input type="email" name="email" placeholder="Email Address" required>

    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Login 🚀</button>

</form>

<div class="footer-link">
    Don’t have an account?
    <a th:href="@{/register}">Register here</a>
</div>

</div>

<script>
function toggleDark() {
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
