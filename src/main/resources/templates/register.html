<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Join TodoBuddy 💜</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #fdf6ff;
  --text: #2d2d2d;
  --card: #ffffff;
  --primary: #7c4dff;
  --accent: #ffd166;
}

.dark {
  --bg: #121212;
  --text: #f1f1f1;
  --card: #1e1e1e;
  --primary: #bb86fc;
  --accent: #f1c40f;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Container */
.container {
  background: var(--card);
  width: 95%;
  max-width: 650px;
  padding: 40px;
  border-radius: 30px;
  box-shadow: 0 20px 45px rgba(0,0,0,0.12);
  position: relative;
}

/* Back Home */
.home-link {
  position: absolute;
  top: 20px;
  left: 25px;
  font-size: 14px;
  color: var(--primary);
  font-weight: bold;
  text-decoration: none;
  transition: 0.2s;
}

.home-link:hover {
  opacity: 0.7;
}

/* Title */
h2 {
  text-align: center;
  color: var(--primary);
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  margin-bottom: 25px;
  font-size: 14px;
  opacity: 0.8;
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.full { grid-column: span 2; }

/* Inputs */
input, select {
  width: 100%;
  padding: 13px;
  border-radius: 15px;
  border: 1px solid #ddd;
}

input:focus, select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 10px rgba(124,77,255,0.2);
  outline: none;
}

/* Button */
button {
  padding: 14px;
  border-radius: 25px;
  border: none;
  font-weight: bold;
  background: var(--primary);
  color: white;
  cursor: pointer;
}

button:hover {
  transform: translateY(-2px);
}

/* Messages */
.message {
  text-align: center;
  margin-bottom: 12px;
}
.error { color: red; }
.success { color: green; }

/* Toggle */
.toggle {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  cursor: pointer;
}

/* Footer */
.footer-link {
  text-align: center;
  margin-top: 20px;
}
.footer-link a {
  color: var(--primary);
  font-weight: bold;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<a th:href="@{/}" class="home-link">← Home</a>

<button class="toggle" onclick="toggleDark()">🌗</button>

<h2>Create Account 💜</h2>
<p class="subtitle">Start planning your day the cute way ✨</p>

<form th:action="@{/register}" method="post">

<p class="message error" th:if="${errormsg}" th:text="${errormsg}"></p>
<p class="message success" th:if="${succMsg}" th:text="${succMsg}"></p>

<div class="grid">

<input name="name" placeholder="Full Name" required>
<input name="email" type="email" placeholder="Email Address" required>

<input name="phoneNo" placeholder="Phone Number">
<input name="dob" type="date">

<select name="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<input name="password" type="password" placeholder="Password" required>

<div class="full">
<button type="submit">Register 🚀</button>
</div>

</div>

</form>

<div class="footer-link">
Already have an account? <a th:href="@{/login}">Login here</a>
</div>

</div>

<script>
function toggleDark() {
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
